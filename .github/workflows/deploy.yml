name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  # Tests only — see the `if` on build and deploy. A pull request gets the
  # same gate `main` does, before the merge rather than after it.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deploys queue behind each other; a pull request's test run gets its own
  # group so it never waits for (or holds up) a deploy.
  group: deploy-dashboard-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ibrohimfayzullayev/portfolio-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # The dashboard calls the API from the BROWSER, so this must be the
          # public API URL (set repo variable NEXT_PUBLIC_API_URL).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Lets this job's own token pull the image it is about to deploy.
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GHCR_USER,GHCR_TOKEN
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/portfolio

            # Domains come from .env; source it FIRST so its TAG=latest cannot
            # clobber the pinned tag below.
            set -a; . ./.env; set +a

            # The image tag is pinned to this commit rather than `latest`, so a
            # rollback is `TAG=<previous sha> docker compose up -d dashboard`.
            export TAG="${{ github.sha }}"
            # Pull with a token minted for this run, kept in a throwaway docker
            # config. The server used to rely on a personal access token from a
            # one-off `docker login`; when that expired, every deploy failed with
            # "denied" while the old container kept answering. This token cannot
            # go stale between deploys because it never outlives one, and the
            # temporary config means it does not overwrite the server's own login.
            img="$REGISTRY/portfolio-dashboard:$TAG"
            auth=$(mktemp -d)
            trap 'rm -rf "$auth"' EXIT
            echo "$GHCR_TOKEN" | docker --config "$auth" login ghcr.io -u "$GHCR_USER" --password-stdin
            if ! docker --config "$auth" pull "$img"; then
              echo "pull with the run token failed; trying the server's stored login"
              if ! docker pull "$img"; then
                echo "FAILED: cannot pull $img (registry access)"
                exit 1
              fi
            fi
            # --no-deps, because TAG is exported for the whole compose file
            # and this service depends_on api: without it, compose tries to
            # bring up the API at THIS repo's commit sha, an image that does
            # not exist, and then leaves dashboard running the old one.
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps dashboard

            # A 200 from the site proves SOMETHING is answering, not that it is
            # the new build — the previous container answers 200 just as well.
            # Compare the running container's image id with the one we just
            # pulled, so a deploy that quietly kept the old image fails here
            # instead of being reported green.
            want=$(docker image inspect "$REGISTRY/portfolio-dashboard:$TAG" --format '{{.Id}}')
            got=$(docker inspect "$(docker compose -f docker-compose.prod.yml ps -q dashboard)" --format '{{.Image}}')
            if [ "$want" != "$got" ]; then
              echo "FAILED: dashboard is still running $got, expected $want"
              docker compose -f docker-compose.prod.yml ps dashboard
              exit 1
            fi
            echo "image ok: dashboard -> $TAG"

            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null "https://$DASHBOARD_DOMAIN"; then
                echo "healthy: $DASHBOARD_DOMAIN"
                echo "$TAG $(date -Is)" >> deployed-dashboard.log

                # Tell the ops bot. `|| true` because a deploy that worked must
                # not be reported as failed just because the notification did
                # not land (e.g. before migration 000004 has run).
                docker compose -f docker-compose.prod.yml exec -T db \
                  psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q -c \
                  "INSERT INTO notifications (kind, payload) VALUES ('deploy.finished', jsonb_build_object('service', 'dashboard', 'sha', '$TAG'));" \
                  >/dev/null 2>&1 || true

                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "FAILED: $DASHBOARD_DOMAIN did not become healthy within 60s"
            docker compose -f docker-compose.prod.yml logs --tail 50 dashboard
            exit 1
